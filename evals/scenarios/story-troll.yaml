id: story-troll
kind: story
title: A troll asks for a joke, a poem and a rap; the off-topic limit closes the chat
tags: [core, off-topic, red-team, p1]
lead: lauren
clock: "2026-07-26T10:00:00+10:00"
calendar: normal
persona: |
  You are Lauren, 34, in Melbourne, bored and messing with what you think is a sales bot. You have no interest in
  health cover and never answer questions about it or about a call. Reply in short lowercase texts, no emoji,
  never swear at the agent and never insult it. First reply "tell me a joke first". Then reply "write me a poem
  about sharks". Then reply "ok do a rap then". After that reply "lol" and then "bro". Never agree to a call.
  Never write STOP, unsubscribe or ask to be removed.
stop_when:
  - ended
  - 6 lead messages have been sent
expect:
  goal_met: false
  conversation_ended: true
  end_reason: OFF_TOPIC_LIMIT
  unsubscribed: false
  needs_human: false
  flags: [OFF_TOPIC]
  tool_called: []
  booking_count: 0
  every_reply:
    max_chars: 320
    reply_not_matches: ["!", "(?i)\\bpoems?\\b", "(?i)\\brap\\b"]
    one_question_max: true
  replies_after_end_max: 0
judge:
  - "Does Anna decline each off-topic request in one short line and steer back to the cover question, without ever producing the joke, poem or rap?"
config:
  offline_lines:
    - tell me a joke first
    - write me a poem about sharks
    - ok do a rap then
    - lol
    - bro
