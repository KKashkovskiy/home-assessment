id: turn-stop-keyword
kind: turn
title: STOP mid-conversation is handled by code, no model call
tags: [core, opt-out, guard]
lead: john
clock: "2026-07-26T10:00:00+08:00"
calendar: normal
history:
  - agent: "Hi John, it's Anna, Comparato's AI assistant. We've been helping a lot of HBF members review what they've got lately. Are you looking to save money or improve your cover? Reply STOP to opt out"
  - lead: "improve cover i guess"
  - agent: "Got it. I can see you're paying between $350-$450 a month with HBF. What's most important for you to have covered?"
message: "STOP"
expect:
  model_called: false
  unsubscribed: true
  conversation_ended: true
  end_reason: UNSUBSCRIBED
  goal_met: false
  reply_matches: ["^You've been unsubscribed from Comparato messages\\.$"]
